; Acoustic Triangulation node firmware
; Build/flash one stage at a time:  pio run -e stage1 -t upload -t monitor
;
; Board: esp32-s3-devkitc-1 works for both the DevKitC-1 (bench) and the
; ESP32-S3-Zero (same S3 chip). USB CDC serial enabled.

[platformio]
default_envs = stage1

[env]
; pioarduino fork = Arduino core 3.x (required for the new i2s_std.h driver).
; The stock PlatformIO "espressif32" platform is core 2.x (old I2S API).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; ESP32-S3-Zero / S3FH4R2 has 4 MB flash (the board profile assumes 8 MB) —
; override size + a 4 MB partition table so the bootloader is happy.
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
board_build.partitions = default.csv
build_flags =
  -D ARDUINO_USB_CDC_ON_BOOT=1     ; Serial over native USB on the S3
  -D ARDUINO_USB_MODE=1            ; hardware USB-Serial/JTAG (stable port, no OTG re-enum)
lib_deps =
  jgromes/RadioLib @ ^7.1.0
  mikalhart/TinyGPSPlus @ ^1.1.0

[env:stage1]                        ; INMP441 I2S mic level meter
build_src_filter = +<stage1_i2s_mic.cpp>

[env:stage2]                        ; GPS NMEA + PPS timestamp
build_src_filter = +<stage2_gps_pps.cpp>

[env:stage3]                        ; onset detection + GPS-disciplined timestamp
build_src_filter = +<stage3_onset_timestamp.cpp>

[env:stage4]                        ; full field node: mic + GPS + LoRa report
build_src_filter = +<stage4_node_lora.cpp>

[env:stage5]                        ; base receiver + 2-node sync check
build_src_filter = +<stage5_base_rx.cpp>

[env:lora_tx]                       ; LoRa link test — transmitter
build_src_filter = +<lora_ping.cpp>
build_flags = ${env.build_flags} -D LORA_TX

[env:lora_rx]                       ; LoRa link test — receiver
build_src_filter = +<lora_ping.cpp>

[env:twonode]                       ; 2-node make-or-break (board A, NODE_ID=1)
build_src_filter = +<twonode_selftest.cpp>

[env:twonode_b]                     ; 2-node make-or-break (board B, NODE_ID=2)
build_src_filter = +<twonode_selftest.cpp>
build_flags = ${env.build_flags} -D NODE_ID=2

; ---- RYLR689 / LLCC68 (SX126x) variants — same sketches, other radio family ----
; Wire BUSY -> GP3 (extra pin vs the SX1276). Everything else identical.
[env:lora_tx_llcc]                  ; LoRa link test — TX, LLCC68
build_src_filter = +<lora_ping.cpp>
build_flags = ${env.build_flags} -D LORA_TX -D LORA_MOD_LLCC68

[env:lora_rx_llcc]                  ; LoRa link test — RX, LLCC68
build_src_filter = +<lora_ping.cpp>
build_flags = ${env.build_flags} -D LORA_MOD_LLCC68

[env:twonode_llcc]                  ; 2-node make-or-break (board A, NODE_ID=1), LLCC68
build_src_filter = +<twonode_selftest.cpp>
build_flags = ${env.build_flags} -D LORA_MOD_LLCC68

[env:twonode_b_llcc]                ; 2-node make-or-break (board B, NODE_ID=2), LLCC68
build_src_filter = +<twonode_selftest.cpp>
build_flags = ${env.build_flags} -D NODE_ID=2 -D LORA_MOD_LLCC68

[env:led_test]                      ; find the onboard RGB LED pin
build_src_filter = +<led_test.cpp>

[env:mic_core_test]                 ; diagnose acoustic_core I2S ring capture
build_src_filter = +<mic_core_test.cpp>

[env:twonode_bench]                 ; BENCH: fake GPS lock, test LoRa exchange (node A)
build_src_filter = +<twonode_selftest.cpp>
build_flags = ${env.build_flags} -D LORA_MOD_LLCC68 -D BENCH_SYNC

[env:twonode_b_bench]               ; BENCH: node B
build_src_filter = +<twonode_selftest.cpp>
build_flags = ${env.build_flags} -D NODE_ID=2 -D LORA_MOD_LLCC68 -D BENCH_SYNC

[env:twonode_shared]                ; BENCH shared-PPS: real dt on the bench (node A / PPS source)
build_src_filter = +<twonode_selftest.cpp>
build_flags = ${env.build_flags} -D LORA_MOD_LLCC68 -D BENCH_SHARED

[env:twonode_b_shared]              ; BENCH shared-PPS: node B
build_src_filter = +<twonode_selftest.cpp>
build_flags = ${env.build_flags} -D NODE_ID=2 -D LORA_MOD_LLCC68 -D BENCH_SHARED

[env:twonode_auto]                  ; BENCH autonomous exchange stress (fake lock + synth onsets), node A
build_src_filter = +<twonode_selftest.cpp>
build_flags = ${env.build_flags} -D LORA_MOD_LLCC68 -D BENCH_SYNC -D BENCH_AUTO

[env:twonode_b_auto]                ; BENCH autonomous exchange stress, node B
build_src_filter = +<twonode_selftest.cpp>
build_flags = ${env.build_flags} -D NODE_ID=2 -D LORA_MOD_LLCC68 -D BENCH_SYNC -D BENCH_AUTO
